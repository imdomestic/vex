name: Vex Build Bundle
description: Collect commit manifest artifacts and verified dependencies for Vex CI pull
inputs:
  mode:
    description: Bundle operation
    default: build
  manifest:
    description: Manifest path relative to the checked out repository
    default: vex.toml
  output:
    description: New bundle directory relative to the checked out repository
    default: .work/vex-bundle
  artifact:
    description: GitHub Actions artifact name configured in vexd
    default: vex-build
outputs:
  artifact-id:
    description: Uploaded GitHub artifact identifier
    value: ${{ steps.upload.outputs.artifact-id }}
  bundle-directory:
    description: Complete bundle directory
    value: ${{ steps.collect.outputs.bundle-directory }}
runs:
  using: composite
  steps:
    - name: Prepare temporary directory
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/.work/vex-action-tmp"
    - name: Configure Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum
      env:
        TMPDIR: ${{ github.workspace }}/.work/vex-action-tmp
    - name: Build bundler
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TMPDIR: ${{ github.workspace }}/.work/vex-action-tmp
      run: go build -trimpath -o "$GITHUB_WORKSPACE/.work/vex-action-tmp/vex-bundle" .
    - name: Collect complete bundle
      id: collect
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_OUTPUT: ${{ inputs.output }}
        TMPDIR: ${{ github.workspace }}/.work/vex-action-tmp
      run: '"$GITHUB_WORKSPACE/.work/vex-action-tmp/vex-bundle" --mode "$INPUT_MODE" --manifest "$INPUT_MANIFEST" --output "$INPUT_OUTPUT"'
    - name: Upload bundle
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.artifact }}
        path: ${{ steps.collect.outputs.bundle-directory }}/
        if-no-files-found: error
        compression-level: 0
        include-hidden-files: true
        overwrite: false
