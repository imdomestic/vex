apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: chorus-system
  labels:
    app.kubernetes.io/name: mc-router
    app.kubernetes.io/part-of: chorus-testbed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-router
        app.kubernetes.io/part-of: chorus-testbed
    spec:
      serviceAccountName: mc-router
      nodeSelector:
        kubernetes.io/hostname: encore
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc-router
          image: itzg/mc-router:1.47.2@sha256:64ae69eaa7a6800a79bbf962f027f4020878efa25183359115bc7f6ee569c36e
          args: [--in-kube-cluster, --api-binding, ':8080']
          env:
            - name: KUBE_NAMESPACE
              value: chorus-rooms
            - name: WEBHOOK_URL
              value: http://10.1.2.137:8790/v1/hooks/mc-router
            - name: WEBHOOK_EVENTS
              value: connect,disconnect
            - name: WEBHOOK_REQUIRE_USER
              value: 'false'
            - name: AUTO_SCALE_UP
              value: 'false'
            - name: AUTO_SCALE_DOWN
              value: 'false'
            - name: CONNECTION_RATE_LIMIT
              value: '20'
            - name: TMPDIR
              value: /work
          ports:
            - name: minecraft
              containerPort: 25565
            - name: api
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /routes
              port: api
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /routes
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mc-router
  namespace: chorus-system
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: mc-router
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: minecraft
